<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<!-- Spieleabend: zwei Platten – links Musik-Bingo (Pink-Orange), rechts Needle Drop (Gold) – auf dunklem Grund -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a52"/><stop offset="1" stop-color="#15121d"/></linearGradient>
  <linearGradient id="la" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa03c"/><stop offset="1" stop-color="#ff3878"/></linearGradient>
  <linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#ff7a59" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a59" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#glow)"/>
<g id="disc">
</g>
<!-- linke Platte (Bingo) -->
<g filter="url(#sh)"><circle cx="190" cy="230" r="140" fill="#111114"/></g>
<g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"><circle cx="190" cy="230" r="128"/><circle cx="190" cy="230" r="114"/><circle cx="190" cy="230" r="100"/><circle cx="190" cy="230" r="86"/></g>
<path d="M190 230 L91 131 A140 140 0 0 1 133 103 Z" fill="#fff" fill-opacity=".1"/>
<circle cx="190" cy="230" r="62" fill="url(#la)"/><circle cx="190" cy="230" r="8" fill="#111114"/>
<!-- rechte Platte (Needle Drop), überlappt vorne -->
<g filter="url(#sh)"><circle cx="322" cy="300" r="140" fill="#111114"/></g>
<g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"><circle cx="322" cy="300" r="128"/><circle cx="322" cy="300" r="114"/><circle cx="322" cy="300" r="100"/><circle cx="322" cy="300" r="86"/></g>
<path d="M322 300 L223 201 A140 140 0 0 1 265 173 Z" fill="#fff" fill-opacity=".1"/>
<path d="M322 300 L421 399 A140 140 0 0 1 379 427 Z" fill="#fff" fill-opacity=".1"/>
<circle cx="322" cy="300" r="62" fill="url(#lb)"/><circle cx="322" cy="300" r="8" fill="#111114"/>
</svg>
