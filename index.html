<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<title>Jukebox</title>
<meta name="description" content="Alle Spiele an einem Ort: Musik-Bingo, Needle Drop und mehr.">
<link rel="apple-touch-icon" href="https://ku3rb1s.github.io/jukebox/apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jukebox">
<link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/base.css?v=1">
<link rel="stylesheet" href="css/hub.css?v=1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
</svg>
<div class="bg"><i></i><i></i><i></i></div>

<header>
  <div class="logo"><img src="icon-192.png?v=1" alt=""><span id="hubTitle">Jukebox</span></div>
  <div class="hdr-r">
    <button class="hbtn" id="btnSettings" aria-label="Einstellungen"><svg class="ic"><use href="#i-sliders"/></svg><span class="lbl">Einstellungen</span></button>
  </div>
</header>

<main>
  <section class="stage glass hub-hero">
    <div class="cat-kicker">Wähle ein Spiel</div>
    <h1 class="hub-h1">Musik raten, Bingo spielen – mit Freunden oder allein.</h1>
    <p class="hub-sub">Alle Spiele laufen direkt im Browser, ohne App und ohne Anmeldung zum Mitspielen.</p>
  </section>

  <div class="apps" id="apps"></div>
  <p class="hub-foot">Sprache und Design gelten für alle Spiele auf diesem Gerät.</p>
</main>

<!-- ============ Einstellungen ============ -->
<dialog id="sheet" class="sheet hub-sheet">
  <div class="sheet-head">
    <span class="grab"></span>
    <span></span>
    <div class="nav-title">Einstellungen</div>
    <button class="nav-done" data-close>Fertig</button>
  </div>
  <div class="sheet-body">
    <div class="group icons" style="margin-top:14px">
      <label class="cell">
        <span class="cell-ic" style="background:#14b8a6"><svg class="ic"><use href="#i-globe"/></svg></span>
        <span class="grow">Sprache<span class="sub">Gilt auch für Musik-Bingo und Needle Drop</span></span>
        <select id="langSel" aria-label="Sprache"></select>
      </label>
    </div>
    <div class="group-h">Design</div>
    <div class="theme-row" id="themeRow"></div>
  </div>
</dialog>

<script src="js/lang/en.js?v=1"></script>
<script src="js/lang/fr.js?v=1"></script>
<script src="js/lang/es.js?v=1"></script>
<script src="js/lang/nb.js?v=1"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/hub.js?v=2"></script>
</body>
</html>
